[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capoeira-agent"
version = "0.1.0"
description = "Agente local que executa comandos emitidos por LLM Web via CapoeiraHost (entrada pela TUI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
capoeira-agent = "capoeira_agent.entry:main"

[tool.setuptools]
packages = [
    "capoeira_agent",
    "capoeira_agent.core",
    "capoeira_agent.commands",
    "capoeira_agent.tui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]